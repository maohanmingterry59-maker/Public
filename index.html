:root{--bg:#fff;--fg:#1f2328;--ac:#1d3f72;--ln:#e3e5e8;--mu:#8a9099;--sf:#f5f6f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16181b;--fg:#e6e8ea;--ac:#8fb4ea;--ln:#2b2f34;--mu:#8b929a;--sf:#1e2125;color-scheme:dark}}
:root[data-theme=dark]{--bg:#16181b;--fg:#e6e8ea;--ac:#8fb4ea;--ln:#2b2f34;--mu:#8b929a;--sf:#1e2125;color-scheme:dark}
:root[data-theme=light]{--bg:#fff;--fg:#1f2328;--ac:#1d3f72;--ln:#e3e5e8;--mu:#8a9099;--sf:#f5f6f7;color-scheme:light}
#dd .tm{display:flex;border-top:1px solid var(--ln);margin-top:4px}#dd .tm button{flex:1;text-align:center}#dd .tm button.on{color:var(--ac);font-weight:600}#dd .tm button:not(.on){color:var(--mu)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Helvetica Neue","PingFang TC","Noto Sans TC",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,select,textarea{background:transparent;border:1px solid var(--ln);border-radius:4px;padding:9px 12px;width:100%;margin:6px 0}
select option{color:#222}
#top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--fg);position:relative}
.nm{color:var(--ac);margin-right:auto;cursor:pointer;white-space:nowrap}#top{gap:9px;padding-left:16px;padding-right:16px}#top .lg,#top .bi{white-space:nowrap}
.tr,.row{display:flex;gap:10px;align-items:center}
.bi i{display:block;font-style:normal}
.lk{color:var(--ac);font-weight:600}
#dd{position:absolute;right:14px;top:62px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:6px 0;z-index:30;min-width:210px}
#dd button{display:block;width:100%;padding:8px 16px}
.pg{max-width:640px;margin:0 auto;padding:20px}
.ct{max-width:360px;margin:12vh auto;padding:0 20px;text-align:center}
.logo{display:block;width:200px;max-width:70%;margin:0 auto 28px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .logo{filter:brightness(0) invert(1)}}:root[data-theme=dark] .logo{filter:brightness(0) invert(1)}
.big{font-size:22px;margin:4px 0;color:var(--ac);word-break:break-all}
.bt{border:1px solid var(--ac);color:var(--ac);border-radius:4px;padding:8px 18px;margin:10px 6px 0;text-align:center;display:inline-block}
.hint{color:#2a7f7a}.mu{color:var(--mu);display:block;font-size:13px}
label{display:block;margin-top:16px;color:var(--ac);font-weight:600}
.lg{padding:2px 6px;color:var(--mu)}.lg.on{color:var(--ac);font-weight:600}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.in{flex:1;cursor:pointer;word-break:break-word}
.ic{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}.ic.on{background:var(--sf);color:#b3412f}
.ck{display:flex;justify-content:space-between;align-items:center;margin:0;padding:8px 0;color:inherit;font-weight:400}
input[type=checkbox],input[type=radio]{appearance:none;-webkit-appearance:none;width:18px;height:18px;padding:0;margin:0;border:1.5px solid var(--ac);border-radius:3px;flex:none}
input[type=radio]{border-radius:50%}input:checked{background:var(--ac)}
input[type=range]{padding:0;border:0}input[type=color]{width:46px;height:32px;padding:2px;flex:none}
#ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ov[hidden],#pp[hidden],#dd[hidden],#sp[hidden]{display:none}
.rt,.qh{display:flex;justify-content:space-between;padding:14px 20px}
.rt{position:relative;z-index:7}
#ov .lk,#ov label{color:inherit}#ov input,#ov select,#ov textarea{border-color:currentColor}
#sb{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.7em;padding:0 16px}
.ln{width:min(100%,390px);text-align:center;line-height:1.5;font-size:var(--fs)}
.w.sel{background:rgba(110,150,255,.38);border-radius:3px}
.fo{font-family:var(--ff);font-style:var(--fy)}.zh{font-family:var(--zf)}
.rb{padding:8px 20px 16px}
.cr{display:flex;justify-content:space-between;align-items:center}
.cb{min-width:44px;height:44px;display:grid;place-items:center;border-radius:50%}.cb.on{background:rgba(128,128,128,.3)}
.rl{display:flex;justify-content:space-between;margin-top:4px}.rl button{opacity:.5}.rl .a{opacity:1;text-decoration:underline;text-underline-offset:4px}
.ph{position:sticky;top:-16px;background:var(--bg);padding:8px 0;z-index:2}
#pr{flex:1;height:36px;margin:0}
#sp{position:absolute;top:58px;right:12px;left:12px;max-width:380px;margin-left:auto;background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:6px;padding:4px 16px 16px;max-height:calc(100% - 290px);overflow:auto;z-index:6;font-size:15px}
#sp label{color:var(--ac)}
#pp{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:grid;place-items:end center}
.pc{background:var(--bg);color:var(--fg);width:100%;max-width:520px;max-height:82vh;overflow:auto;border-radius:10px 10px 0 0;padding:16px 20px 28px}
.sec{border-top:1px solid var(--ln);margin-top:12px;padding-top:8px}.sec p{margin:4px 0}
.qb{flex:1;overflow:auto;padding:0 20px 30px}.qc{border-bottom:1px solid currentColor;padding:14px 0}.qc label{display:flex;gap:10px;margin:8px 0;font-weight:400}
.rs{margin:auto;text-align:center;padding:0 20px}.lv{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:.15em .45em;font-size:calc(var(--fs)*1.3);margin:10px 0}.rs .bi i{line-height:1.3}.sm{font-size:13px;opacity:.55}
.w ruby{ruby-position:over}.w rt{font-size:.42em;opacity:.7;font-family:system-ui,sans-serif;letter-spacing:0}.ln.zh{line-height:1.9}input.bx{width:24px;height:24px;margin:0 6px 0 0;border-width:2px;border-radius:5px}</style>
